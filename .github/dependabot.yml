version: 2
updates:
    -   package-ecosystem: "npm"
        directory: "/"
        schedule:
            interval: "weekly"
            day: sunday
            time: "04:00"
            timezone: Europe/Stockholm
        open-pull-requests-limit: 3
        groups:
            next:
                patterns:
                    - "next"
                    - "eslint-config-next"
                    - "@next/*"
            react:
                patterns:
                    - "react"
                    - "react-dom"
                    - "@types/react"
                    - "@types/react-dom"
            other:
                patterns:
                    - "*"
        ignore:
            # typescript-eslint (via eslint-config-next) supports only typescript <6.1
            -   dependency-name: "typescript"
                versions: [ ">=6.1.0" ]
            # eslint-plugin-react, -import and -jsx-a11y (via eslint-config-next) support only eslint 9
            -   dependency-name: "eslint"
                versions: [ ">=10.0.0" ]
    -   package-ecosystem: "github-actions"
        directory: "/"
        schedule:
            interval: "weekly"
